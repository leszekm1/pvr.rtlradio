name: Build LibreELEC release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: libreelec-release-${{ github.ref }}
  cancel-in-progress: false

env:
  ADDON_ID: pvr.rtlradio
  LIBREELEC_REF: 12.2.1

jobs:
  build:
    name: LibreELEC 12.2 Generic x86_64
    runs-on: ubuntu-22.04
    timeout-minutes: 330

    steps:
      - name: Check out add-on source
        uses: actions/checkout@v4

      - name: Free build disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup

      - name: Install LibreELEC build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y bc g++ gcc git gperf make openjdk-11-jre-headless \
            libparse-yapp-perl libxml-parser-perl lzop patchutils rdfind rsync \
            unzip xfonts-utils xsltproc xz-utils zip

      - name: Check out LibreELEC
        uses: actions/checkout@v4
        with:
          repository: LibreELEC/LibreELEC.tv
          ref: ${{ env.LIBREELEC_REF }}
          path: libreelec

      - name: Cache downloaded sources and compiler output
        uses: actions/cache@v4
        with:
          path: |
            libreelec/sources
            libreelec/build.LibreELEC-Generic.x86_64-12.2-devel/.ccache
          key: libreelec-${{ env.LIBREELEC_REF }}-generic-x86_64-${{ github.sha }}
          restore-keys: |
            libreelec-${{ env.LIBREELEC_REF }}-generic-x86_64-

      - name: Seed GMP source archive
        run: |
          gmp_archive="libreelec/sources/gmp/gmp-6.3.0.tar.xz"
          gmp_sha256="a3c2b80201b89e68616f4ad30bc66aee4927c3ce50e33929ca819d5c43538898"
          gmp_url="https://ftp.gnu.org/gnu/gmp/gmp-6.3.0.tar.xz"
          mkdir -p "$(dirname "$gmp_archive")"
          if ! echo "$gmp_sha256  $gmp_archive" | sha256sum --check --status; then
            curl -L --fail --retry 5 --retry-all-errors --connect-timeout 20 \
              --output "$gmp_archive" \
              "$gmp_url"
          fi
          echo "$gmp_sha256  $gmp_archive" | sha256sum --check
          printf '%s\n' "$gmp_url" > "$gmp_archive.url"
          printf '%s\n' "$gmp_sha256" > "$gmp_archive.sha256"

      - name: Configure LibreELEC package
        run: |
          cp -R packaging/libreelec/packages/. libreelec/packages/
          mkdir -p libreelec/packages/addons/addon-depends/faad2/patches
          cp depends/common/faad2-hdc/faad2-hdc-support.patch \
            libreelec/packages/addons/addon-depends/faad2/patches/faad2-001-hdc-support.patch
          archive_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/archive/${GITHUB_SHA}.tar.gz"
          curl -L --fail --retry 3 --output source.tar.gz "$archive_url"
          source_sha256="$(sha256sum source.tar.gz | cut -d ' ' -f 1)"
          python3 tools/render-libreelec-package.py \
            --template packaging/libreelec/package.mk.in \
            --output libreelec/packages/mediacenter/kodi-binary-addons/pvr.rtlradio/package.mk \
            --version "$GITHUB_SHA" \
            --sha256 "$source_sha256" \
            --site "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --url "$archive_url"

      - name: Build installable add-on ZIP
        working-directory: libreelec
        env:
          PROJECT: Generic
          ARCH: x86_64
          ADDON_OVERWRITE: "yes"
        run: scripts/create_addon pvr.rtlradio

      - name: Validate and name release artifact
        id: package
        run: |
          zip_path="$(find libreelec/target/addons -type f -name 'pvr.rtlradio-*.zip' -print -quit)"
          test -n "$zip_path"
          binary_member="$(unzip -Z1 "$zip_path" | grep -E '^pvr\.rtlradio/pvr\.rtlradio\.so\.' | head -1)"
          test -n "$binary_member"
          unzip -p "$zip_path" "$binary_member" > /tmp/pvr.rtlradio.so
          readelf -Ws /tmp/pvr.rtlradio.so | grep -q 'NeAACDecInitHDC'
          addon_version="$(python3 tools/validate-addon-zip.py \
            --addon-id "$ADDON_ID" \
            --github-output "$GITHUB_OUTPUT" \
            --print-version \
            "$zip_path")"
          release_zip="pvr.rtlradio-${addon_version}-LibreELEC-Generic.x86_64-${LIBREELEC_REF}.zip"
          cp "$zip_path" "$release_zip"
          sha256sum "$release_zip" > "$release_zip.sha256"
          echo "release_zip=$release_zip" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pvr.rtlradio-${{ steps.package.outputs.addon_version }}-LibreELEC-Generic.x86_64-${{ env.LIBREELEC_REF }}
          path: |
            ${{ steps.package.outputs.release_zip }}
            ${{ steps.package.outputs.release_zip }}.sha256
          if-no-files-found: error

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: test "$GITHUB_REF_NAME" = "v${{ steps.package.outputs.addon_version }}"

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ZIP: ${{ steps.package.outputs.release_zip }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$RELEASE_ZIP" "$RELEASE_ZIP.sha256" \
            --title "pvr.rtlradio ${{ steps.package.outputs.addon_version }} for LibreELEC 12.2 Generic x86_64" \
            --generate-notes
